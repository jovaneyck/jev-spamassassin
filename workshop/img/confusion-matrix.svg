<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#111111">
  <title>Confusion matrix for the ten emails, and which boxes precision, recall and accuracy use</title>
  <rect width="880" height="330" fill="#FFF8EC"/>
  <text x="195" y="70" text-anchor="middle" font-weight="700">Flagged</text>
  <text x="345" y="70" text-anchor="middle" font-weight="700">Not flagged</text>
  <text x="110" y="122" text-anchor="end" font-weight="700" fill="#E6197E">Is spam</text>
  <text x="110" y="196" text-anchor="end" font-weight="700" fill="#2E86AB">Is ham</text>
  <rect x="120" y="80" width="150" height="74" fill="#DFF3E4" stroke="#111111" stroke-width="1.5"/><text x="195" y="112" text-anchor="middle" font-weight="800" font-size="13.5">Nailed it = 3</text><text x="195" y="134" text-anchor="middle" font-size="12">TP: spam caught</text>
  <rect x="270" y="80" width="150" height="74" fill="#FFE9A8" stroke="#111111" stroke-width="1.5"/><text x="345" y="112" text-anchor="middle" font-weight="800" font-size="13.5">Slipped through = 1</text><text x="345" y="134" text-anchor="middle" font-size="12">FN: spam in the inbox</text>
  <rect x="120" y="154" width="150" height="74" fill="#FFD0E6" stroke="#111111" stroke-width="1.5"/><text x="195" y="186" text-anchor="middle" font-weight="800" font-size="13.5">Friendly fire = 1</text><text x="195" y="208" text-anchor="middle" font-size="12">FP: real mail binned</text>
  <rect x="270" y="154" width="150" height="74" fill="#DFF3E4" stroke="#111111" stroke-width="1.5"/><text x="345" y="186" text-anchor="middle" font-weight="800" font-size="13.5">Chill = 5</text><text x="345" y="208" text-anchor="middle" font-size="12">TN: ham left alone</text>
  <text x="270" y="262" text-anchor="middle" font-size="12">T/F: was the filter right? P/N: did it say spam?</text>
  <text x="270" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#E6197E">Friendly fire is the expensive one.</text>
  <g transform="translate(480,40)" font-size="10" text-anchor="middle" font-weight="700"><rect x="0" y="0" width="36" height="24" fill="#E6197E" stroke="#111111"/><text x="18" y="16" fill="#fff">TP</text><rect x="36" y="0" width="36" height="24" fill="#fff" stroke="#111111"/><text x="54" y="16" fill="#111111">FN</text><rect x="0" y="24" width="36" height="24" fill="#E6197E" stroke="#111111"/><text x="18" y="40" fill="#fff">FP</text><rect x="36" y="24" width="36" height="24" fill="#fff" stroke="#111111"/><text x="54" y="40" fill="#111111">TN</text></g>
  <g transform="translate(480,140)" font-size="10" text-anchor="middle" font-weight="700"><rect x="0" y="0" width="36" height="24" fill="#E6197E" stroke="#111111"/><text x="18" y="16" fill="#fff">TP</text><rect x="36" y="0" width="36" height="24" fill="#E6197E" stroke="#111111"/><text x="54" y="16" fill="#fff">FN</text><rect x="0" y="24" width="36" height="24" fill="#fff" stroke="#111111"/><text x="18" y="40" fill="#111111">FP</text><rect x="36" y="24" width="36" height="24" fill="#fff" stroke="#111111"/><text x="54" y="40" fill="#111111">TN</text></g>
  <g transform="translate(480,240)" font-size="10" text-anchor="middle" font-weight="700"><rect x="0" y="0" width="36" height="24" fill="#E6197E" stroke="#111111"/><text x="18" y="16" fill="#fff">TP</text><rect x="36" y="0" width="36" height="24" fill="#fff" stroke="#111111"/><text x="54" y="16" fill="#111111">FN</text><rect x="0" y="24" width="36" height="24" fill="#fff" stroke="#111111"/><text x="18" y="40" fill="#111111">FP</text><rect x="36" y="24" width="36" height="24" fill="#E6197E" stroke="#111111"/><text x="54" y="40" fill="#fff">TN</text></g>
  <text x="570" y="58" font-weight="800" font-size="14">Precision = TP / (TP + FP) = 3 / 4 = 0.75</text>
  <text x="570" y="78" font-size="12">Of everything we binned, how much was spam?</text>
  <text x="570" y="158" font-weight="800" font-size="14">Recall = TP / (TP + FN) = 3 / 4 = 0.75</text>
  <text x="570" y="178" font-size="12">Of all the spam, how much did we catch?</text>
  <text x="570" y="258" font-weight="800" font-size="14">Accuracy = (TP + TN) / all = 8 / 10 = 0.80</text>
  <text x="570" y="278" font-size="12">Of all emails, how many landed on the right side?</text>
</svg>
