<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 330" width="830" height="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#222">
  <title>Confusion matrix for the ten emails, and which cells precision, recall and accuracy use</title>
  <rect width="830" height="330" fill="#fff"/>

  <!-- main matrix -->
  <text x="185" y="70" text-anchor="middle" font-weight="600">Flagged</text>
  <text x="315" y="70" text-anchor="middle" font-weight="600">Not flagged</text>
  <text x="110" y="120" text-anchor="end" font-weight="600" fill="#c0392b">Is spam</text>
  <text x="110" y="190" text-anchor="end" font-weight="600" fill="#1f6f99">Is ham</text>

  <rect x="120" y="80" width="130" height="70" fill="#eaf6ec" stroke="#222"/>
  <rect x="250" y="80" width="130" height="70" fill="#fdecec" stroke="#222"/>
  <rect x="120" y="150" width="130" height="70" fill="#fdecec" stroke="#222"/>
  <rect x="250" y="150" width="130" height="70" fill="#eaf6ec" stroke="#222"/>

  <g text-anchor="middle">
    <text x="185" y="108" font-weight="700" font-size="15">TP = 3</text><text x="185" y="130" font-size="12">spam caught</text>
    <text x="315" y="108" font-weight="700" font-size="15">FN = 1</text><text x="315" y="130" font-size="12">spam slipped through</text>
    <text x="185" y="178" font-weight="700" font-size="15">FP = 1</text><text x="185" y="200" font-size="12">real mail lost</text>
    <text x="315" y="178" font-weight="700" font-size="15">TN = 5</text><text x="315" y="200" font-size="12">ham left alone</text>
  </g>
  <text x="250" y="250" text-anchor="middle" font-size="12">green = right, red = mistake</text>
  <text x="250" y="270" text-anchor="middle" font-size="12">T/F: was Jev right? P/N: did Jev say spam?</text>

  <!-- mini matrices: dark = cells the metric uses -->
  <g font-size="10" text-anchor="middle" font-weight="700">
    <!-- precision: TP, FP (flagged column) -->
    <g transform="translate(440,40)">
      <rect width="36" height="24" fill="#555"/><rect x="36" width="36" height="24" fill="#eee" stroke="#bbb"/>
      <rect y="24" width="36" height="24" fill="#555"/><rect x="36" y="24" width="36" height="24" fill="#eee" stroke="#bbb"/>
      <text x="18" y="16" fill="#fff">TP</text><text x="54" y="16">FN</text><text x="18" y="40" fill="#fff">FP</text><text x="54" y="40">TN</text>
    </g>
    <!-- recall: TP, FN (spam row) -->
    <g transform="translate(440,140)">
      <rect width="36" height="24" fill="#555"/><rect x="36" width="36" height="24" fill="#555"/>
      <rect y="24" width="36" height="24" fill="#eee" stroke="#bbb"/><rect x="36" y="24" width="36" height="24" fill="#eee" stroke="#bbb"/>
      <text x="18" y="16" fill="#fff">TP</text><text x="54" y="16" fill="#fff">FN</text><text x="18" y="40">FP</text><text x="54" y="40">TN</text>
    </g>
    <!-- accuracy: all cells, TP and TN on top -->
    <g transform="translate(440,240)">
      <rect width="36" height="24" fill="#555"/><rect x="36" width="36" height="24" fill="#bbb"/>
      <rect y="24" width="36" height="24" fill="#bbb"/><rect x="36" y="24" width="36" height="24" fill="#555"/>
      <text x="18" y="16" fill="#fff">TP</text><text x="54" y="16">FN</text><text x="18" y="40">FP</text><text x="54" y="40" fill="#fff">TN</text>
    </g>
  </g>

  <text x="530" y="58" font-weight="700" font-size="14">Precision = TP / (TP + FP) = 3 / 4 = 0.75</text>
  <text x="530" y="78" font-size="12">Of the emails we flagged, how many are spam?</text>
  <text x="530" y="158" font-weight="700" font-size="14">Recall = TP / (TP + FN) = 3 / 4 = 0.75</text>
  <text x="530" y="178" font-size="12">Of all the spam, how much did we catch?</text>
  <text x="530" y="258" font-weight="700" font-size="14">Accuracy = (TP + TN) / all = 8 / 10 = 0.80</text>
  <text x="530" y="278" font-size="12">Of all emails, how many are on the right side?</text>
</svg>
