  </g>
  <text x="40" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="900" fill="#111111">Build a spam filter in one hour.</text>
  <path d="M 520 365 Q 700 352 880 362" stroke="#E6197E" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="40" y="398" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#111111">01 Ask · 02 Batch · 03 Measure · 04 Improve · 05 Test. Real emails. Real experiments. Your own spam filter.</text>
