<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <title>Jo! meets Jev. Build a spam filter in one hour.</title>
  <rect width="1200" height="420" fill="#FFF8EC"/>
  <polygon points="560,70 1170,40 1150,250 590,280" fill="#FFD21F"/>
  <text x="40" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#111111">HANDS-ON WORKSHOP · 60 MIN · (VIBE) CODING REQUIRED</text>
  <line x1="40" y1="48" x2="1160" y2="48" stroke="#111111" stroke-width="2"/>
  <text x="30" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="210" font-weight="900" font-style="italic" fill="#E6197E">Jo!</text>
  <text x="380" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#111111">meets</text>
  <text x="640" y="225" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="900" fill="#111111">Jev.</text>
