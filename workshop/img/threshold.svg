<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#111111">
  <title>Ten emails on a score line. The 0.5 threshold splits them into four boxes: Nailed it, Slipped through, Friendly fire and Chill.</title>
  <rect width="780" height="320" fill="#FFF8EC"/>
  <rect x="100" y="60" width="320" height="85" fill="#FFE9A8"/>
  <rect x="420" y="60" width="320" height="85" fill="#DFF3E4"/>
  <rect x="100" y="145" width="320" height="85" fill="#DFF3E4"/>
  <rect x="420" y="145" width="320" height="85" fill="#FFD0E6"/>
  <text x="260" y="48" text-anchor="middle" font-weight="700">Not flagged: inbox</text>
  <text x="580" y="48" text-anchor="middle" font-weight="700">Flagged: spam folder</text>
  <line x1="420" y1="30" x2="420" y2="245" stroke="#E6197E" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="420" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#E6197E">threshold 0.5</text>
  <text x="88" y="107" text-anchor="end" font-weight="700" fill="#E6197E">spam</text>
  <text x="88" y="192" text-anchor="end" font-weight="700" fill="#2E86AB">ham</text>
  <g font-weight="800" font-size="13">
    <text x="110" y="78">Slipped through (FN)</text>
    <text x="730" y="78" text-anchor="end">Nailed it (TP)</text>
    <text x="110" y="222">Chill (TN)</text>
    <text x="730" y="222" text-anchor="end" fill="#E6197E">Friendly fire (FP)</text>
  </g>
  <circle cx="720.8" cy="110" r="11" fill="#E6197E" stroke="#111111" stroke-width="1.5"/><circle cx="676.0" cy="110" r="11" fill="#E6197E" stroke="#111111" stroke-width="1.5"/><circle cx="612.0" cy="110" r="11" fill="#E6197E" stroke="#111111" stroke-width="1.5"/><circle cx="356.0" cy="110" r="11" fill="#E6197E" stroke="#111111" stroke-width="1.5"/>
  <circle cx="548.0" cy="180" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="292.0" cy="180" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="228.0" cy="180" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="196.0" cy="180" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="164.0" cy="180" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="132.0" cy="180" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/>
  <line x1="100" y1="245" x2="740" y2="245" stroke="#111111" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="12"><text x="100" y="264">0</text><text x="260" y="264">0.25</text><text x="420" y="264">0.5</text><text x="580" y="264">0.75</text><text x="740" y="264">1</text></g>
  <text x="420" y="295" text-anchor="middle" font-size="12">Jev's spam score</text>
</svg>
