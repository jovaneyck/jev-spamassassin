<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#111111">
  <title>AUC: pick one spam and one ham at random. How often does the spam score higher? Here 23 of 24 pairs.</title>
  <rect width="780" height="300" fill="#FFF8EC"/>
  <text x="420" y="30" text-anchor="middle" font-weight="700">Pick any spam and any ham. Does the spam look shadier?</text>
  <text x="88" y="85" text-anchor="end" font-weight="700" fill="#E6197E">spam</text>
  <text x="88" y="165" text-anchor="end" font-weight="700" fill="#2E86AB">ham</text>
  <line x1="356.0" y1="80" x2="548.0" y2="160" stroke="#E6197E" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="470" y="108" font-size="12" font-weight="800" fill="#E6197E">wrong order</text>
  <circle cx="720.8" cy="80" r="11" fill="#E6197E" stroke="#111111" stroke-width="1.5"/><circle cx="676.0" cy="80" r="11" fill="#E6197E" stroke="#111111" stroke-width="1.5"/><circle cx="612.0" cy="80" r="11" fill="#E6197E" stroke="#111111" stroke-width="1.5"/><circle cx="356.0" cy="80" r="11" fill="#E6197E" stroke="#111111" stroke-width="1.5"/>
  <circle cx="548.0" cy="160" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="292.0" cy="160" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="228.0" cy="160" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="196.0" cy="160" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="164.0" cy="160" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/><circle cx="132.0" cy="160" r="11" fill="#2E86AB" stroke="#111111" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="11"><text x="720.8" y="60">0.97</text><text x="676.0" y="60">0.90</text><text x="612.0" y="60">0.80</text><text x="356.0" y="60">0.40</text></g>
  <g text-anchor="middle" font-size="11"><text x="548.0" y="190">0.70</text><text x="292.0" y="190">0.30</text><text x="228.0" y="190">0.20</text><text x="196.0" y="190">0.15</text><text x="164.0" y="190">0.10</text><text x="132.0" y="190">0.05</text></g>
  <line x1="100" y1="205" x2="740" y2="205" stroke="#111111" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="12"><text x="100" y="222">0</text><text x="420" y="222">0.5</text><text x="740" y="222">1</text></g>
  <text x="420" y="255" text-anchor="middle" font-weight="800" font-size="14">4 spam × 6 ham = 24 pairs · 23 in the right order · AUC = 23 / 24 = 0.96</text>
  <text x="420" y="278" text-anchor="middle" font-size="12">No threshold involved. AUC judges the ranking, not where you draw the line.</text>
</svg>
