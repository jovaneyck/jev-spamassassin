<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#222">
  <title>AUC: the share of spam-ham pairs where the spam scores higher; one of 24 pairs is in the wrong order</title>
  <rect width="780" height="300" fill="#fff"/>

  <text x="420" y="30" text-anchor="middle" font-weight="600">Pick any spam and any ham. Does the spam score higher?</text>

  <!-- lane labels -->
  <text x="88" y="85" text-anchor="end" font-weight="600" fill="#c0392b">spam</text>
  <text x="88" y="165" text-anchor="end" font-weight="600" fill="#1f6f99">ham</text>

  <!-- the one wrong pair: ham 0.70 above spam 0.40 -->
  <line x1="356" y1="80" x2="548" y2="160" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="470" y="108" font-size="12" font-weight="700" fill="#c0392b">wrong order</text>

  <g fill="#d1495b">
    <circle cx="720.8" cy="80" r="10"/><circle cx="676" cy="80" r="10"/><circle cx="612" cy="80" r="10"/><circle cx="356" cy="80" r="10"/>
  </g>
  <g text-anchor="middle" font-size="11"><text x="720.8" y="60">0.97</text><text x="676" y="60">0.90</text><text x="612" y="60">0.80</text><text x="356" y="60">0.40</text></g>
  <g fill="#2e86ab">
    <circle cx="548" cy="160" r="10"/><circle cx="292" cy="160" r="10"/><circle cx="228" cy="160" r="10"/><circle cx="196" cy="160" r="10"/><circle cx="164" cy="160" r="10"/><circle cx="132" cy="160" r="10"/>
  </g>
  <g text-anchor="middle" font-size="11"><text x="548" y="188">0.70</text><text x="292" y="188">0.30</text><text x="228" y="188">0.20</text><text x="196" y="188">0.15</text><text x="164" y="188">0.10</text><text x="132" y="188">0.05</text></g>

  <!-- axis -->
  <line x1="100" y1="205" x2="740" y2="205" stroke="#222"/>
  <g text-anchor="middle" font-size="12"><text x="100" y="222">0</text><text x="420" y="222">0.5</text><text x="740" y="222">1</text></g>

  <text x="420" y="255" text-anchor="middle" font-weight="700" font-size="14">4 spam × 6 ham = 24 pairs · 23 in the right order · AUC = 23 / 24 = 0.96</text>
  <text x="420" y="278" text-anchor="middle" font-size="12">No threshold involved: AUC judges the ranking, not where the line is.</text>
</svg>
